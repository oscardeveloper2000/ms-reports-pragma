server:
  port: "${SERVER_PORT:8082}"
spring:
  application:
    name: "ms-reports"
  devtools:
    add-properties: false
    restart:
      enabled: false
    livereload:
      enabled: false
  profiles:
    include: null
aws:
  region: "${AWS_REGION:us-east-1}"
  dynamodb:
    endpoint: "http://localhost:8000"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"
routes:
  report:
    paths:
      reports: "/api/v1/report"
entrypoint:
  sqs:
    region: "${AWS_REGION:us-east-1}"
    queueUrl: "${QUEUE_URL_REPORT_LOAN:https://sqs.us-east-1.amazonaws.com/794490944018/loan-report-queue}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1