server:
  port: "${SERVER_PORT:8083}"
spring:
  application:
    name: "ms-reports"
  devtools:
    add-properties: false
    restart:
      enabled: false
    livereload:
      enabled: false
  profiles:
    include: null
aws:
  region: "us-east-1"
  dynamodb:
    endpoint: "http://localhost:8000"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"
entrypoint:
  sqs:
    region: "${SQS_REGION:us-east-1}"
    queueUrl: "${REPORT_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/794490944018/loan-report-queue}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1